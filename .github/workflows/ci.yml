name: CI

on:
  push:
  pull_request:

jobs:
  client:
    name: Client (lint, type-check, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Lint
        run: npm run lint
        working-directory: client

      - name: Type-check
        run: npx tsc --noEmit
        working-directory: client

      - name: Test
        run: npx vitest run
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client

  server:
    name: Server (lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Lint
        run: npm run lint
        working-directory: server

      # mongodb-memory-server downloads a real mongod binary on first use;
      # caching it avoids re-downloading ~100MB on every run. No Redis
      # service container is needed today — the AI queue is mocked in tests
      # (see server/queues/__mocks__/aiQueue.js) since BullMQ forces an
      # eager connection regardless of ioredis options. Add a `services:
      # redis:` block here if/when tests are added that exercise the real
      # queue rather than mocking it.
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Test
        run: npm test
        working-directory: server
